spring.application.name=API-GATEWAY

server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.client.register-with-eureka=true

eureka.client.fetch-registry=true

eureka.instance.prefer-ip-address=true

spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=profile-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://PROFILE-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/profiles/**

spring.cloud.gateway.server.webflux.routes[2].id=application-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://APPLICATION-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/applications/**

spring.cloud.gateway.server.webflux.routes[3].id=job-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://JOB-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/jobs/**

jwt.secret=CareerLinkNetworksJWTSecretKey2026VerySecure123456789

# CORS
# CORS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedOriginPatterns=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowCredentials=true
spring.cloud.gateway.server.webflux.globalcors.add-to-simple-url-handler-mapping=true